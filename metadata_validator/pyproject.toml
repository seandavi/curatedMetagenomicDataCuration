[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metadata-validator"
version = "0.1.0"
description = "A comprehensive Python framework for validating, harmonizing, and enriching sample metadata"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Curated Metagenomic Data Curation Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
ontology = [
    "pronto>=2.5.0",
    "requests>=2.26.0",
]
fuzzy = [
    "python-Levenshtein>=0.12.2",
    "fuzzywuzzy>=0.18.0",
]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "flake8>=3.9",
    "ruff>=0.1.0",
]
all = [
    "pronto>=2.5.0",
    "requests>=2.26.0",
    "python-Levenshtein>=0.12.2",
    "fuzzywuzzy>=0.18.0",
]

[project.urls]
Homepage = "https://github.com/waldronlab/curatedMetagenomicDataCuration"
Repository = "https://github.com/waldronlab/curatedMetagenomicDataCuration"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
